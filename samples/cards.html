<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- 明朝体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">

<style>

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
}

/* DSEG7などを配置した場合 */
/*
@font-face{
    font-family:"DSEG7";
    src:url("fonts/DSEG7Classic-Regular.woff2");
}
*/

.card{

    width:220px;

    background:#020402;

    color:#9dfb9d;

    border:2px solid #4f7a4f;

    padding:18px;

    box-shadow:
        inset 0 0 20px rgba(0,255,120,.08),
        0 0 10px rgba(0,255,80,.15);

    position:relative;
}

/* CRT走査線 */

.card::after{

    content:"";

    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 1px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;

}

.header{

    font-size:12px;

    color:#8eb68e;

    letter-spacing:2px;

    border-bottom:1px solid #446644;

    padding-bottom:6px;

    margin-bottom:16px;

}


.kanji{

    font-family:
        "Noto Serif JP",
        serif;

    font-size:34px;

    font-weight:700;

    color:white;

    text-align:center;

    letter-spacing:.18em;

    transform:scaleX(.92);

}


.ruby{

    text-align:center;

    margin-top:2px;

    font-size:13px;

    letter-spacing:.08em;

    color:#8ad58a;

}


.value{

    margin:28px 0 22px;

    text-align:center;

    /*
    font-family:"DSEG7";
    */

    font-size:64px;

    color:#d9ffd9;

    text-shadow:
        0 0 6px #66ff66,
        0 0 18px #66ff66;

    letter-spacing:.05em;

}


.cost{

    text-align:center;

    font-size:14px;

    color:#b8d8b8;

    letter-spacing:.15em;

}


.footer{

    margin-top:26px;

    border-top:1px solid #446644;

    padding-top:8px;

    text-align:center;

    font-size:15px;

    color:#ffffff;

    letter-spacing:.2em;

}

.footer small{

    display:block;

    color:#78a878;

    font-size:10px;

    margin-top:4px;

    letter-spacing:.25em;

}

</style>

</head>

<body>

<div class="card">

    <div class="header">
        ATTACK PROGRAM
    </div>

    <div class="kanji">
        強襲
    </div>

    <div class="ruby">
        シュトゥルムアングリフ
    </div>

    <div class="value">
        +8
    </div>

    <div class="cost">
        LP COST&nbsp;4
    </div>

    <div class="footer">

        STURM-08

        <small>
            STURMANGRIFF
        </small>

    </div>

</div>

</body>
</html>
